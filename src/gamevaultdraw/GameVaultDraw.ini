[Display]
; 1 = borderless fullscreen without changing the Windows display mode.
; 0 = retain the game's original window.
Fullscreen=1

; 320x200 VGA artwork was intended for a 4:3 display.
AspectWidth=4
AspectHeight=3

[Timing]
; 0 disables limiting. 60 approximates the original VGA refresh cadence.
FrameLimit=60
